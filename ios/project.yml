name: Polytheta
options:
  bundleIdPrefix: com.andrewblount
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ZAR4A6G772
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
targets:
  Polytheta:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources, Shared]
    dependencies:
      - target: PolythetaWatch
        embed: true
    # APNs push for trade warnings and exits (PushDelegate in PolythetaApp.swift).
    # The App ID needs the Push Notifications capability and the App Store
    # profile must include it; both are managed through the ASC API.
    entitlements:
      path: Polytheta.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewblount.polytheta
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "15"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: Polytheta
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # HTTPS only, no custom crypto — skips the export-compliance prompt
        # on every TestFlight upload.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
  PolythetaMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Sources, Shared]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewblount.polytheta.mac
        PRODUCT_NAME: Polytheta
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "15"
        INFOPLIST_KEY_CFBundleDisplayName: Polytheta
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIconMac
        COMBINE_HIDPI_IMAGES: YES

  PolythetaWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [Watch, Shared]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewblount.polytheta.watchkitapp
        MARKETING_VERSION: "1.7.0"
        CURRENT_PROJECT_VERSION: "15"
        INFOPLIST_KEY_CFBundleDisplayName: PolyTheta
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.andrewblount.polytheta
        INFOPLIST_KEY_WKWatchKitApp: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
